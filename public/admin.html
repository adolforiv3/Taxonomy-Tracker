<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxonomy Logger — Edit Runs</title>
<style>
  :root{
    --paper:#f5f5f7; --paper-line: rgba(0,0,0,0.05); --ink:#1d1d1f; --ink-soft:#6e6e73;
    --teal:#5e5ce6; --teal-dark:#4a48c4; --teal-bg: rgba(94,92,230,0.1);
    --red:#ff3b30; --red-bg: rgba(255,59,48,0.12);
    --card:#ffffff; --border: rgba(0,0,0,0.09);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 6px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.16), 0 2px 8px rgba(0,0,0,0.08);
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#000000; --paper-line: rgba(255,255,255,0.07); --ink:#f5f5f7; --ink-soft:#98989d;
      --teal:#7d7aff; --teal-dark:#a5a3ff; --teal-bg: rgba(125,122,255,0.18);
      --red:#ff453a; --red-bg: rgba(255,69,58,0.16);
      --card:#1c1c1e; --border: rgba(255,255,255,0.12);
      --shadow-sm: 0 0 0 1px rgba(255,255,255,0.06);
      --shadow-md: 0 0 0 1px rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.5);
      --shadow-lg: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
    }
  }
  *{box-sizing:border-box;}
  button:not(:disabled){cursor:pointer;}
  @media (hover:hover){ button:not(:disabled):hover{ filter:brightness(0.94); transition:filter .15s ease; } }
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}

  header{padding:20px 28px;display:flex;align-items:baseline;gap:10px;justify-content:space-between;}
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.02em;}
  header .sub{font-size:12px;color:var(--teal);font-weight:600;letter-spacing:.02em;}
  header .userinfo{font-size:12px;color:var(--ink-soft);display:flex;gap:12px;align-items:center;}
  header .userinfo button{background:transparent;border:none;color:var(--teal);font-size:12px;font-weight:600;padding:0;margin:0;}

  main{max-width:900px;margin:0 auto;padding:8px 28px 60px;}

  .authbox{max-width:360px;margin:80px auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:28px;box-shadow:var(--shadow-md);}
  .authbox h2{font-size:16px;margin:0 0 6px;font-weight:700;letter-spacing:-0.01em;}
  .authbox p{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}
  .authbox input{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:16px;margin-bottom:12px;
    background:var(--card);color:var(--ink);}
  .authbox input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-bg);}
  .authbox button{width:100%;padding:13px;border:none;border-radius:var(--r-sm);background:var(--teal);color:#fff;
    font-weight:600;font-size:14px;margin-bottom:8px;}
  .authbox .toggle{text-align:center;font-size:12.5px;color:var(--ink-soft);}
  .authbox .toggle button{width:auto;background:none;color:var(--teal);padding:0;margin:0;text-decoration:underline;}
  .authbox .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}

  .entry{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;}
  .entry-header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;}
  .entry-info{font-size:14px;font-weight:600;color:var(--ink);}
  .entry-meta{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .entry-actions{display:flex;gap:6px;}
  .entry-actions button{background:transparent;border:1px solid var(--border);color:var(--teal);border-radius:var(--r-sm);
    padding:6px 12px;font-size:12px;font-weight:600;}
  .entry-actions button.del{color:var(--red);}
  @media (hover:hover){ .entry-actions button.del:hover{ background:var(--red-bg); border-color:var(--red); } }

  .empty{color:var(--ink-soft);text-align:center;padding:40px 20px;font-size:14px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;}
  .card h2{font-size:16px;margin:0 0 16px;font-weight:700;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
    font-weight:700;margin-bottom:6px;}
  .field input, .field textarea{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-sm);
    font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-bg);}

  .savebtn{width:100%;padding:13px;border:none;border-radius:var(--r-sm);background:var(--teal);color:#fff;
    font-weight:600;font-size:14px;margin-top:8px;}
  .savebtn:disabled{background:var(--border);color:var(--ink-soft);}

  .header-tabs{display:flex;gap:8px;border-bottom:1px solid var(--paper-line);padding:0 0 16px 0;margin-bottom:20px;}
  .header-tabs button{background:none;border:none;color:var(--ink-soft);font-size:14px;font-weight:600;padding:4px 0;
    border-bottom:2px solid transparent;}
  .header-tabs button.active{color:var(--ink);border-bottom-color:var(--teal);}
</style>
</head>
<body>
<div id="app"></div>

<script>
const STUDY_MATCH = window.location.pathname.match(/^\/s\/([^\/]+)/);
const STUDY_ID = STUDY_MATCH ? STUDY_MATCH[1] : null;

let state = {
  mode: "login", // "login", "teamSelect", "teamView", "adminView"
  user: null,
  token: sessionStorage.getItem("tl_admin_token"),
  teamId: null,
  entries: [],
  editingId: null,
  editDraft: null,
  loading: false,
  saving: false,
  loginErr: "",
  week: isoWeek(new Date().toISOString().slice(0, 10))
};

function isoWeek(dateStr) {
  const d = new Date(`${dateStr}T00:00:00Z`);
  const target = new Date(d.valueOf());
  const dayNr = (d.getUTCDay() + 6) % 7;
  target.setUTCDate(target.getUTCDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setUTCMonth(0, 1);
  if (target.getUTCDay() !== 4) {
    target.setUTCMonth(0, 1 + ((4 - target.getUTCDay() + 7) % 7));
  }
  const week = 1 + Math.ceil((firstThursday - target.valueOf()) / (7 * 24 * 3600 * 1000));
  return `${d.getUTCFullYear()}-W${String(week).padStart(2, "0")}`;
}

const app = document.getElementById("app");

async function init() {
  if (state.token) {
    try {
      const res = await fetch("/api/users", {
        method: "POST",
        headers: { "content-type": "application/json", "x-user-token": state.token },
        body: JSON.stringify({ action: "whoami" })
      });
      if (res.ok) {
        const data = await res.json();
        state.user = data.user;
        state.mode = "adminView";
        fetchEntries();
      } else {
        state.token = null;
        sessionStorage.removeItem("tl_admin_token");
      }
    } catch (err) {
      state.token = null;
      sessionStorage.removeItem("tl_admin_token");
    }
  }
  render();
}

function render() {
  app.innerHTML = "";
  if (state.user) {
    app.appendChild(renderAdminView());
  } else {
    app.appendChild(renderAuthGate());
  }
}

function renderAuthGate() {
  const wrap = document.createElement("div");
  wrap.innerHTML = `<header><h1>Taxonomy Logger</h1><span class="sub">Edit Runs</span></header>`;

  const main = document.createElement("main");
  const box = document.createElement("div");
  box.className = "authbox";

  if (state.mode === "teamSelect") {
    box.innerHTML = `
      <h2>Field Team</h2>
      <p>Enter your team name to view and edit your runs.</p>
      <input id="teamInput" type="text" placeholder="e.g. Team A, Route 5" autocomplete="off" />
      <button id="teamBtn">View My Runs</button>
      <div class="toggle"><button id="backBtn">Back</button></div>
      <div class="err">${state.loginErr}</div>
    `;
    box.querySelector("#teamBtn").onclick = () => {
      const team = document.getElementById("teamInput").value.trim();
      if (!team) {
        state.loginErr = "Team name required";
        render();
      } else {
        state.teamId = team;
        state.mode = "teamView";
        state.loginErr = "";
        fetchEntries();
      }
    };
    box.querySelector("#backBtn").onclick = () => { state.mode = "login"; state.loginErr = ""; render(); };
    box.querySelector("#teamInput").addEventListener("keydown", (e) => { if (e.key === "Enter") box.querySelector("#teamBtn").click(); });
  } else {
    box.innerHTML = `
      <h2>Edit Runs</h2>
      <p>Are you a lab admin or field team?</p>
      <button id="adminBtn">Lab Admin Login</button>
      <button id="teamBtn" style="background:var(--teal-bg);color:var(--teal-dark);">Field Team</button>
      <div class="err">${state.loginErr}</div>
    `;
    box.querySelector("#adminBtn").onclick = () => { state.mode = "login"; state.loginErr = ""; render(); showAdminLogin(); };
    box.querySelector("#teamBtn").onclick = () => { state.mode = "teamSelect"; state.loginErr = ""; render(); };
  }

  main.appendChild(box);
  wrap.appendChild(main);
  return wrap;
}

function showAdminLogin() {
  setTimeout(() => {
    const box = document.querySelector(".authbox");
    if (box) {
      box.innerHTML = `
        <h2>Lab Admin Login</h2>
        <p>Log in with your credentials.</p>
        <input id="emailInput" type="email" placeholder="Email" autocomplete="email" />
        <input id="pwInput" type="password" placeholder="Password" autocomplete="current-password" />
        <button id="loginBtn">Log In</button>
        <div class="toggle"><button id="backBtn2">Back</button></div>
        <div class="err">${state.loginErr}</div>
      `;
      document.getElementById("loginBtn").onclick = tryLogin;
      document.getElementById("backBtn2").onclick = () => { state.mode = "login"; state.loginErr = ""; render(); };
      document.getElementById("emailInput").addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
    }
  }, 0);
}

async function tryLogin() {
  const email = document.getElementById("emailInput")?.value || "";
  const password = document.getElementById("pwInput")?.value || "";

  if (!email.trim() || !password.trim()) {
    state.loginErr = "Email and password required";
    render();
    return;
  }

  try {
    const res = await fetch("/api/users", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "login", email: email.trim(), password })
    });
    const data = await res.json();
    if (!res.ok) {
      state.loginErr = data.error || "Login failed";
      render();
      showAdminLogin();
    } else {
      state.token = data.token;
      state.user = data.user;
      sessionStorage.setItem("tl_admin_token", state.token);
      state.loginErr = "";
      state.mode = "adminView";
      render();
      fetchEntries();
    }
  } catch (err) {
    state.loginErr = "Couldn't reach server";
    render();
    showAdminLogin();
  }
}

function renderAdminView() {
  const wrap = document.createElement("div");
  const header = document.createElement("header");
  header.innerHTML = `<div><h1>Taxonomy Logger</h1><span class="sub">Edit Runs</span></div>`;

  const userinfo = document.createElement("div");
  userinfo.className = "userinfo";
  if (state.teamId) {
    userinfo.innerHTML = `<span>${state.teamId}</span>`;
  } else {
    userinfo.innerHTML = `<span>${state.user.email}</span>`;
    const logoutBtn = document.createElement("button");
    logoutBtn.textContent = "Log Out";
    logoutBtn.onclick = logout;
    userinfo.appendChild(logoutBtn);
  }
  header.appendChild(userinfo);
  wrap.appendChild(header);

  const main = document.createElement("main");

  if (state.editingId) {
    main.appendChild(renderEditEntry());
  } else {
    main.appendChild(renderEntriesList());
  }

  wrap.appendChild(main);
  return wrap;
}

function renderEntriesList() {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>Runs — Week ${state.week}</h2>`;

  if (state.loading) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "Loading…";
    card.appendChild(empty);
    return card;
  }

  const filtered = state.teamId
    ? state.entries.filter(e => e.teamId === state.teamId)
    : state.entries;

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = state.teamId ? "No runs submitted yet." : "No entries for this week.";
    card.appendChild(empty);
    return card;
  }

  filtered.forEach(e => {
    const row = document.createElement("div");
    row.className = "entry";
    row.innerHTML = `
      <div class="entry-header">
        <div>
          <div class="entry-info">${escapeHtml(e.signType)} · ${escapeHtml(e.protocol || "?")}</div>
          <div class="entry-meta">${e.date} ${e.timestamp} · Route: ${escapeHtml(e.route || "?")}</div>
        </div>
        <div class="entry-actions">
          <button>Edit</button>
          ${!state.teamId ? '<button class="del">Delete</button>' : ''}
        </div>
      </div>
    `;
    row.querySelector("button").onclick = () => {
      state.editingId = e.id;
      state.editDraft = { ...e };
      render();
    };
    if (!state.teamId) {
      row.querySelector("button.del").onclick = () => deleteEntry(e.id);
    }
    card.appendChild(row);
  });

  return card;
}

function renderEditEntry() {
  const entry = state.editDraft;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>Edit Run</h2>`;

  const fields = [
    { label: "Date", key: "date", type: "date" },
    { label: "Route", key: "route", type: "text" },
    { label: "Sign Type", key: "signType", type: "text" },
    { label: "Note", key: "note", type: "textarea" }
  ];

  fields.forEach(f => {
    const div = document.createElement("div");
    div.className = "field";
    const lbl = document.createElement("label");
    lbl.textContent = f.label;
    div.appendChild(lbl);

    if (f.type === "textarea") {
      const ta = document.createElement("textarea");
      ta.value = entry[f.key] || "";
      ta.oninput = (e) => { entry[f.key] = e.target.value; };
      div.appendChild(ta);
    } else {
      const input = document.createElement("input");
      input.type = f.type;
      input.value = entry[f.key] || "";
      input.oninput = (e) => { entry[f.key] = e.target.value; };
      div.appendChild(input);
    }
    card.appendChild(div);
  });

  const saveBtn = document.createElement("button");
  saveBtn.className = "savebtn";
  saveBtn.textContent = state.saving ? "Saving…" : "Save Changes";
  saveBtn.disabled = state.saving;
  saveBtn.onclick = saveEntry;
  card.appendChild(saveBtn);

  const backBtn = document.createElement("button");
  backBtn.className = "savebtn";
  backBtn.style.cssText = "background:transparent;color:var(--ink-soft);border:1px solid var(--border);margin-top:8px;";
  backBtn.textContent = "Cancel";
  backBtn.onclick = () => { state.editingId = null; state.editDraft = null; render(); };
  card.appendChild(backBtn);

  return card;
}

async function saveEntry() {
  const entry = state.editDraft;
  state.saving = true;
  render();

  try {
    const updates = {
      date: entry.date,
      route: entry.route,
      signType: entry.signType,
      note: entry.note
    };

    const payload = { id: entry.id, studyId: STUDY_ID, week: state.week, updates };
    if (state.teamId) payload.teamId = state.teamId;
    if (state.user) payload.userToken = state.token;

    const res = await fetch("/api/entries", {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const data = await res.json();
      alert(data.error || "Save failed");
    } else {
      state.editingId = null;
      state.editDraft = null;
      fetchEntries();
    }
  } catch (err) {
    alert("Couldn't save entry");
  }
  state.saving = false;
}

async function deleteEntry(id) {
  if (!confirm("Delete this run?")) return;

  try {
    const payload = { id, studyId: STUDY_ID, week: state.week };
    if (state.user) payload.userToken = state.token;

    const res = await fetch("/api/entries", {
      method: "DELETE",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (!res.ok) {
      const data = await res.json();
      alert(data.error || "Delete failed");
    } else {
      state.entries = state.entries.filter(e => e.id !== id);
      render();
    }
  } catch (err) {
    alert("Couldn't delete entry");
  }
}

async function fetchEntries() {
  state.loading = true;
  render();

  try {
    const url = `/api/entries?study=${encodeURIComponent(STUDY_ID || "default")}&week=${state.week}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Fetch failed");
    const data = await res.json();
    state.entries = data.entries || [];
  } catch (err) {
    // keep last known list
  }
  state.loading = false;
  render();
}

function logout() {
  state.user = null;
  state.token = null;
  sessionStorage.removeItem("tl_admin_token");
  state.mode = "login";
  state.loginErr = "";
  state.editingId = null;
  render();
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

init();
</script>
</body>
</html>

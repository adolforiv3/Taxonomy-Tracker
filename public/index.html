<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Taxonomy Logger</title>
<style>
  :root{
    --paper:#f5f5f7;
    --paper-line: rgba(0,0,0,0.05);
    --ink:#1d1d1f;
    --ink-soft:#6e6e73;
    --teal:#5e5ce6;
    --teal-dark:#4a48c4;
    --teal-bg: rgba(94,92,230,0.1);
    --amber:#ff9500;
    --amber-bg: rgba(255,149,0,0.12);
    --red:#ff3b30;
    --red-bg: rgba(255,59,48,0.12);
    --card:#ffffff;
    --border: rgba(0,0,0,0.09);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 6px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.16), 0 2px 8px rgba(0,0,0,0.08);
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#000000;
      --paper-line: rgba(255,255,255,0.07);
      --ink:#f5f5f7;
      --ink-soft:#98989d;
      --teal:#7d7aff;
      --teal-dark:#a5a3ff;
      --teal-bg: rgba(125,122,255,0.18);
      --amber:#ff9f0a;
      --amber-bg: rgba(255,159,10,0.16);
      --red:#ff453a;
      --red-bg: rgba(255,69,58,0.16);
      --card:#1c1c1e;
      --border: rgba(255,255,255,0.12);
      --shadow-sm: 0 0 0 1px rgba(255,255,255,0.06);
      --shadow-md: 0 0 0 1px rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.5);
      --shadow-lg: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button:not(:disabled){cursor:pointer;}
  @media (hover:hover){ button:not(:disabled):hover{ filter:brightness(0.94); transition:filter .15s ease; } }
  html,body{margin:0;padding:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;-webkit-font-smoothing:antialiased;}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;
    background:var(--paper);}

  /* Desktop: keep the phone-shaped layout legible without stretching tap targets absurdly wide */
  @media (min-width:700px){
    body{display:flex;justify-content:center;align-items:flex-start;user-select:auto;}
    #app{height:94vh;margin-top:3vh;border-radius:var(--r-lg);overflow:hidden;
      box-shadow:var(--shadow-lg);border:1px solid var(--border);}
    main{overscroll-behavior:contain;}
  }
  @media (max-width:699px){ body{user-select:none;} }

  header{padding:22px 20px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.02em;color:var(--ink);}
  header .brand-eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);font-weight:600;
    display:block;margin-bottom:2px;}
  header .livepill{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.4px;color:var(--ink-soft);
    display:flex;align-items:center;gap:6px;text-transform:uppercase;}
  header .livedot{width:7px;height:7px;border-radius:50%;background:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.2);}

  .ctxbar{font-size:12.5px;color:var(--ink-soft);padding:10px 20px;border-bottom:1px solid var(--paper-line);
    display:flex;flex-wrap:wrap;gap:5px 14px;align-items:center;}
  .ctxbar b{color:var(--ink);font-weight:600;}
  .ctxbar .ctxbtns{margin-left:auto;display:flex;gap:8px;}
  .ctxbar .ctxbtns .changebtn{background:transparent;border:1px solid var(--border);color:var(--teal);
    border-radius:var(--r-pill);padding:6px 14px;font-size:12px;font-weight:600;}

  nav.tabs{display:flex;border-bottom:1px solid var(--paper-line);padding:0 20px;gap:4px;}
  nav.tabs button{flex:1;padding:14px 4px;background:transparent;color:var(--ink-soft);border:none;
    font-size:13.5px;font-weight:600;border-bottom:2px solid transparent;letter-spacing:-0.01em;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--teal);}

  main{flex:1;overflow-y:auto;padding:16px 20px;padding-bottom:100px;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .tile{min-height:60px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
    color:var(--ink);font-size:15px;font-weight:600;padding:12px;display:flex;align-items:center;justify-content:center;
    text-align:center;line-height:1.25;box-shadow:var(--shadow-sm);transition:transform .08s ease, box-shadow .15s ease;}
  .tile:active{transform:scale(0.97);}
  .tile.selected{background:var(--ink);color:var(--card);border-color:var(--ink);box-shadow:var(--shadow-md);}
  .tile.wide{grid-column:1/-1;}

  .icon-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .icon-tile{aspect-ratio:1;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);
    color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    box-shadow:var(--shadow-sm);padding:10px 6px;transition:transform .08s ease;}
  .icon-tile-emoji{font-size:34px;line-height:1;}
  .icon-tile-label{font-size:12.5px;font-weight:600;text-align:center;line-height:1.2;}
  .icon-tile:active{transform:scale(0.96);background:var(--teal-bg);border-color:var(--teal);}
  @media (min-width:400px){ .icon-grid{grid-template-columns:repeat(3,1fr);} }

  .backbtn{background:var(--card);border:1px solid var(--border);color:var(--ink);border-radius:var(--r-sm);
    padding:10px 14px;font-size:13.5px;font-weight:600;margin-bottom:12px;box-shadow:var(--shadow-sm);}

  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:18px 2px 10px;font-weight:700;}
  .section-label:first-child{margin-top:2px;}

  textarea, select, input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--ink);
    border-radius:var(--r-sm);padding:11px 14px;font-size:16px;font-family:inherit;transition:border-color .15s ease, box-shadow .15s ease;}
  textarea{resize:none;min-height:56px;}
  textarea:focus, input:focus, select:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-bg);}

  .logbtn-wrap{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;padding:14px 20px 20px;
    background:linear-gradient(to top, var(--paper) 65%, transparent);}
  .logbtn{width:100%;padding:16px;font-size:15px;font-weight:600;border:none;border-radius:var(--r-sm);
    background:var(--ink);color:var(--card);letter-spacing:-0.01em;box-shadow:var(--shadow-lg);transition:transform .08s ease;}
  .logbtn:active{transform:scale(0.98);}
  .logbtn:disabled{background:var(--border);color:var(--ink-soft);box-shadow:none;}

  .entry{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;
    box-shadow:var(--shadow-sm);}
  .entry-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .entry-taxonomy{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-0.01em;}
  .entry-meta{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .entry-note{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .delbtn{background:transparent;border:1px solid var(--border);color:var(--red);border-radius:var(--r-sm);
    padding:7px 12px;font-size:12.5px;font-weight:600;flex-shrink:0;}
  .empty{color:var(--ink-soft);text-align:center;padding:40px 10px;font-size:14px;}

  .toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);
    padding:13px 22px;border-radius:var(--r-pill);font-weight:500;font-size:13.5px;z-index:50;
    box-shadow:var(--shadow-lg);max-width:85%;text-align:center;}

  .exportbtn{width:100%;padding:14px;font-size:14px;font-weight:600;border:none;border-radius:var(--r-sm);
    background:var(--teal);color:#fff;margin-bottom:12px;letter-spacing:-0.01em;box-shadow:var(--shadow-sm);}

  .weekbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
  .weekbar .weeklabel{font-size:13px;color:var(--ink-soft);}
  .weekbar .weeklabel b{color:var(--ink);}
  .refreshbtn{background:var(--card);border:1px solid var(--border);color:var(--teal);border-radius:var(--r-pill);
    padding:8px 14px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow-sm);flex-shrink:0;}

  .teampill{display:inline-block;background:var(--teal-bg);color:var(--teal-dark);border-radius:6px;padding:2px 7px;
    font-size:11px;font-weight:700;margin-right:6px;}
  .countbadge{display:inline-block;background:var(--paper-line);color:var(--ink-soft);border-radius:6px;padding:1px 7px;
    font-size:11px;font-weight:700;margin-left:6px;font-variant-numeric:tabular-nums;}

  .qty-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .qty-stepper{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .qty-btn{width:30px;height:30px;padding:0;border:1px solid var(--border);background:var(--card);border-radius:50%;
    font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink);
    transition:all .15s ease;}
  .qty-btn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-bg);}
  .qty-count{min-width:20px;text-align:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}

  .navtoggle{background:var(--teal);color:#fff;border:none;border-radius:var(--r-pill);
    padding:6px 14px;font-size:12px;font-weight:600;margin-left:auto;}

  .reviewblock{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;
    margin-bottom:10px;box-shadow:var(--shadow-sm);}
  .reviewblock .rlabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;margin-bottom:4px;}
  .reviewblock .rvalue{font-size:14.5px;font-weight:600;}

  .loadingwrap{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:14px;text-align:center;padding:40px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- STUDY RESOLUTION ---------------- */
const STUDY_MATCH = window.location.pathname.match(/^\/s\/([^\/]+)/);
const STUDY_ID = STUDY_MATCH ? STUDY_MATCH[1] : "default";

/* ---------------- TAXONOMY (defaults for the root app; overridden per-study) ---------------- */
let SIGN_EMOJI = {
  "Construction Sign": "🚧",
  "Crosswalk": "🦓",
  "Cycling": "🚴",
  "Do Not Enter": "⛔",
  "End Restrictions": "🔚",
  "No Cycling": "🚳",
  "No Pedestrian Sign": "🚷",
  "One Way (left)": "⬅️",
  "One Way (right)": "➡️",
  "Parking Area": "🅿️",
  "Pedestrian Crossing Sign": "🚸",
  "Pedestrian Zone Ends Sign": "🏁",
  "Pedestrian Zone Sign": "🚶",
  "Railroad Crossing Sign": "🚆",
  "School Zone": "🏫",
  "Stop Sign": "🛑",
  "Street Name Sign": "🪧",
  "Traffic Light": "🚦",
  "Trailhead Sign": "🥾",
  "Turn Restrictions": "↩️"
};
let SIGN_TYPES = Object.keys(SIGN_EMOJI).sort((a,b) => a.localeCompare(b));
let PROTOCOLS = ["Walk", "Exploration", "Fast-Walk"];
let STUDY_NAME = "Taxonomy Logger";
let LOCATION_SCHEDULE = []; // DRI-set {week, state, city}[] — a study can span weeks in different places

function isoWeek(dateStr){
  const d = new Date(dateStr + "T00:00:00Z");
  const target = new Date(d.valueOf());
  const dayNr = (d.getUTCDay() + 6) % 7;
  target.setUTCDate(target.getUTCDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setUTCMonth(0, 1);
  if(target.getUTCDay() !== 4){
    target.setUTCMonth(0, 1 + ((4 - target.getUTCDay() + 7) % 7));
  }
  const week = 1 + Math.ceil((firstThursday - target.valueOf()) / (7*24*3600*1000));
  return `${d.getUTCFullYear()}-W${String(week).padStart(2,"0")}`;
}

/* ---------------- STATE ---------------- */
let state = {
  studyLoaded: STUDY_ID === "default",
  studyError: false,
  date: new Date().toISOString().slice(0,10),
  // Not persisted — each run re-confirms who's logging (a device may be
  // shared across teams over the course of a day), so team/protocol reset
  // to blank both on a page refresh and after every submitted run.
  teamId: null,
  protocol: null,
  environment: null,
  objectKit: null,
  route: "",
  locationState: null,
  locationCity: null,
  assignedRoutes: [], // this team's routes for today — >1 means the field user must pick one
  calibrationSessionId: "",
  captureSessionId: "",
  sessionNotes: "",
  tab: "log", // 'log' entry tab or 'weekly'
  cart: [], // pending items for the current run
  finishStep: null, // null | 'details' | 'review'
  submitting: false,
  weekly: { week: isoWeek(new Date().toISOString().slice(0,10)), entries: [], loading: false },
  editingId: null,
  editDraft: null,
  toast: null,
  assignments: [], // today's Lab Admin-set {teamId, kitNumber, route, environment} for this study
  assignmentsLoading: false
};

let pollTimer = null;

function setupComplete(){
  // A route must be resolved (either it was the only one, or the field
  // user explicitly picked one among backups) before setup counts as done.
  return state.teamId && state.protocol && !!state.route;
}

/* ---------------- ASSIGNMENTS ----------------
   Kit, route, and environment are no longer picked live by field teams —
   a Lab Admin plans them out ahead of time per team per day (see the
   Assignments panel in the Study Builder), eliminating the double-booking
   problem a real-time kit-hold system used to exist to solve. The field
   app's only job here is showing today's assigned teams and prefilling
   whichever one is picked. */
async function fetchAssignments(){
  state.assignmentsLoading = true;
  render();
  try {
    const res = await fetch(`/api/assignments?study=${encodeURIComponent(STUDY_ID)}&date=${encodeURIComponent(state.date)}`);
    if(res.ok){
      const data = await res.json();
      state.assignments = data.assignments || [];
    }
  } catch (err) {
    // keep last known list
  }
  state.assignmentsLoading = false;
  render();
}

function selectAssignment(a){
  // Location is a study-level, per-week concept the DRI schedules (see
  // resolveWeekLocation) — it doesn't come from the team's assignment.
  state.teamId = a.teamId;
  state.objectKit = a.kitNumber;
  state.assignedRoutes = a.routes || [];
  if(state.assignedRoutes.length === 1){
    state.route = state.assignedRoutes[0].route;
    state.environment = state.assignedRoutes[0].environment;
  } else {
    // Multiple routes on offer (primary + backup(s)) — force an explicit
    // choice instead of silently defaulting to the primary, since a backup
    // exists specifically for when the primary is obstructed or otherwise
    // compromising data accuracy; the field user is the one who knows
    // which is actually true today.
    state.route = "";
    state.environment = null;
  }
  render();
}

function selectRoute(r){
  state.route = r.route;
  state.environment = r.environment;
  render();
}

// The DRI schedules one location per ISO week (see studies.mts's
// locationSchedule) since a study can span weeks in different cities as the
// team travels. Missing entirely here (rather than defaulting to blank)
// means the DRI hasn't scheduled this week yet — render() blocks the whole
// app on that rather than letting entries go out with no location at all.
function resolveWeekLocation(){
  const week = isoWeek(state.date);
  const match = LOCATION_SCHEDULE.find(l => l.week === week);
  state.locationState = match ? match.state : null;
  state.locationCity = match ? match.city : null;
}

/* ---------------- STUDY LOADING ---------------- */
async function loadStudy(){
  try {
    const res = await fetch(`/api/studies?id=${encodeURIComponent(STUDY_ID)}`);
    if(!res.ok) throw new Error("not found");
    const data = await res.json();
    const s = data.study;
    STUDY_NAME = s.name;
    PROTOCOLS = s.protocols.length ? s.protocols : PROTOCOLS;
    LOCATION_SCHEDULE = Array.isArray(s.locationSchedule) ? s.locationSchedule : [];
    resolveWeekLocation();
    SIGN_EMOJI = {};
    s.signTypes.forEach(t => { SIGN_EMOJI[t.name] = t.emoji; });
    SIGN_TYPES = Object.keys(SIGN_EMOJI).sort((a,b) => a.localeCompare(b));
    state.studyLoaded = true;
  } catch (err) {
    state.studyError = true;
  }
  render();
  fetchAssignments();
}

/* ---------------- RENDER ---------------- */
const app = document.getElementById("app");

function render(){
  const prevMain = app.querySelector("main");
  const prevScroll = prevMain ? prevMain.scrollTop : 0;

  app.innerHTML = "";
  app.appendChild(renderHeader());

  if(state.studyError){
    app.appendChild(renderStudyError());
  } else if(!state.studyLoaded){
    app.appendChild(renderStudyLoading());
  } else if(STUDY_ID !== "default" && !state.locationCity){
    // Location is required, foundational metadata now (not optional
    // context) — block the whole app rather than let entries go out
    // without it, same as an invalid study link does.
    app.appendChild(renderLocationMissing());
  } else if(state.tab === "weekly" && !setupComplete()){
    app.appendChild(renderEarlyEditBar());
    app.appendChild(renderWeekly());
  } else if(!setupComplete()){
    app.appendChild(renderSetupEditBar());
    app.appendChild(renderSetup());
  } else {
    app.appendChild(renderCtxBar());
    app.appendChild(renderTabs());
    if(state.tab === "log"){
      app.appendChild(renderLogFlow());
    } else {
      app.appendChild(renderWeekly());
    }
  }

  if(state.toast){
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = state.toast;
    app.appendChild(t);
  }

  const newMain = app.querySelector("main");
  if(newMain) newMain.scrollTop = prevScroll;
}

function renderHeader(){
  const h = document.createElement("header");
  const eyebrow = STUDY_ID === "default" ? "Field Capture" : escapeHtml(STUDY_NAME);
  h.innerHTML = `<div><span class="brand-eyebrow">${eyebrow}</span><h1>Taxonomy Logger</h1></div><span class="livepill"><span class="livedot"></span>Live</span>`;
  return h;
}

function renderStudyLoading(){
  const main = document.createElement("main");
  main.innerHTML = `<div class="loadingwrap">Loading study…</div>`;
  return main;
}

function renderStudyError(){
  const main = document.createElement("main");
  main.innerHTML = `<div class="loadingwrap">This study link isn't valid, or the study may have been removed.<br><br>Check the link with your DRI / Lab Admin.</div>`;
  return main;
}

function renderLocationMissing(){
  const main = document.createElement("main");
  main.innerHTML = `<div class="loadingwrap">No location has been scheduled for this week yet (${escapeHtml(isoWeek(state.date))}).<br><br>Ask your DRI to schedule this week's state/city in the Study Builder before logging can start.</div>`;
  return main;
}

function renderEarlyEditBar(){
  const bar = document.createElement("div");
  bar.className = "ctxbar";
  bar.innerHTML = `<span>Weekly Document</span>`;
  const backBtn = document.createElement("button");
  backBtn.className = "navtoggle";
  backBtn.textContent = "← Back to Setup";
  backBtn.onclick = () => { state.tab = "log"; stopPolling(); render(); };
  bar.appendChild(backBtn);
  return bar;
}

function renderSetupEditBar(){
  const bar = document.createElement("div");
  bar.className = "ctxbar";
  bar.innerHTML = `<span>Session Setup</span>`;
  const editBtn = document.createElement("button");
  editBtn.className = "navtoggle";
  editBtn.textContent = "Edit Runs →";
  editBtn.onclick = () => { window.location.href = `/admin`; };
  bar.appendChild(editBtn);
  return bar;
}

function renderCtxBar(){
  const bar = document.createElement("div");
  bar.className = "ctxbar";
  bar.innerHTML = `
    <span>${state.date}</span>
    <span>Team <b>${state.teamId}</b></span>
    <span><b>${state.protocol}</b></span>
    <span><b>${state.environment}</b></span>
    <span>Kit <b>${state.objectKit}</b></span>
    <span>Rt <b>${escapeHtml(state.route)}</b></span>
    <span>${escapeHtml(state.locationCity)}, <b>${escapeHtml(state.locationState)}</b></span>
  `;
  const btns = document.createElement("div");
  btns.className = "ctxbtns";

  const navBtn = document.createElement("button");
  navBtn.className = "navtoggle";
  if(state.tab === "log"){
    navBtn.textContent = "Edit Runs →";
    navBtn.onclick = () => { window.location.href = `/admin`; };
  } else {
    navBtn.textContent = "← Home";
    navBtn.onclick = () => { state.tab = "log"; stopPolling(); render(); };
  }
  btns.appendChild(navBtn);

  const changeBtn = document.createElement("button");
  changeBtn.className = "changebtn";
  changeBtn.textContent = "Change";
  changeBtn.onclick = () => {
    // Location is week-scoped, not team/run-scoped — it stays put here.
    state.teamId=null; state.protocol=null; state.environment=null; state.objectKit=null;
    state.route=""; state.assignedRoutes=[];
    render();
    fetchAssignments();
  };
  btns.appendChild(changeBtn);

  bar.appendChild(btns);
  return bar;
}

function renderTabs(){
  const nav = document.createElement("nav");
  nav.className = "tabs";
  const t1 = document.createElement("button");
  t1.textContent = "Log Entry";
  t1.className = state.tab==="log" ? "active" : "";
  t1.onclick = () => { state.tab="log"; stopPolling(); render(); };
  const t2 = document.createElement("button");
  t2.textContent = "Weekly Document";
  t2.className = state.tab==="weekly" ? "active" : "";
  t2.onclick = () => { state.tab="weekly"; render(); fetchWeekly(); startPolling(); };
  nav.appendChild(t1); nav.appendChild(t2);
  return nav;
}

function renderSetup(){
  const main = document.createElement("main");
  main.style.paddingBottom = "20px";

  if(!state.teamId){
    main.appendChild(rowTitle(`Team${state.assignmentsLoading ? " (loading…)" : ""}`));
    if(!state.assignmentsLoading && state.assignments.length === 0){
      const empty = document.createElement("div");
      empty.style.cssText = "font-size:13px;color:var(--ink-soft);padding:8px 2px;line-height:1.5;";
      empty.textContent = "No team assignments for today yet. Ask your Lab Admin to set up today's kit/route/environment assignments in the Study Builder.";
      main.appendChild(empty);
    } else {
      main.appendChild(tileGrid(state.assignments.map(a => ({
        label: a.teamId, wide: true, sel: false, onClick: () => selectAssignment(a)
      }))));
    }
    return main;
  }

  const back = document.createElement("button");
  back.className = "backbtn";
  back.textContent = "‹ Not my team";
  back.onclick = () => {
    state.teamId=null; state.protocol=null; state.environment=null; state.objectKit=null;
    state.route=""; state.assignedRoutes=[];
    render();
  };
  main.appendChild(back);

  const locationLine = document.createElement("div");
  locationLine.className = "reviewblock";
  locationLine.innerHTML = `
    <div class="rlabel">Assigned Today</div>
    <div class="rvalue">${escapeHtml(state.teamId)}</div>
    <div class="entry-meta" style="margin-top:4px;">Kit ${state.objectKit} · ${escapeHtml(state.locationCity)}, ${escapeHtml(state.locationState)}</div>
  `;
  main.appendChild(locationLine);

  // A backup route exists specifically for when the primary is obstructed
  // or otherwise compromising accuracy, so this can't be defaulted — the
  // field user is the one who actually knows which is true right now.
  if(state.assignedRoutes.length > 1 && !state.route){
    main.appendChild(rowTitle("Which route are you using?"));
    state.assignedRoutes.forEach(r => {
      // Field teams refer to routes by name in practice ("Main St Loop"),
      // not by their planning label ("Primary"/"Backup 1") — so the route
      // name leads, with the label and environment as secondary context.
      const card = document.createElement("button");
      card.className = "tile wide";
      card.style.cssText = "text-align:left;display:block;padding:14px 16px;margin-bottom:10px;height:auto;";
      card.innerHTML = `<div style="font-weight:700;">${escapeHtml(r.route || r.label)}</div>
        <div style="font-size:12.5px;font-weight:500;color:var(--ink-soft);margin-top:2px;">${escapeHtml(r.label)} · ${escapeHtml(r.environment)}</div>`;
      card.onclick = () => selectRoute(r);
      main.appendChild(card);
    });
    return main;
  }

  const routeLine = document.createElement("div");
  routeLine.className = "entry-meta";
  routeLine.style.cssText = "margin:-10px 0 16px 2px;";
  routeLine.textContent = `Route: ${state.route || "—"} · ${state.environment || "—"}`;
  if(state.assignedRoutes.length > 1){
    const switchLink = document.createElement("button");
    switchLink.textContent = "Change Route";
    switchLink.style.cssText = "background:none;border:none;color:var(--teal);font-size:12.5px;font-weight:600;margin-left:8px;padding:0;cursor:pointer;";
    switchLink.onclick = () => { state.route=""; state.environment=null; render(); };
    routeLine.appendChild(switchLink);
  }
  main.appendChild(routeLine);

  main.appendChild(rowTitle("Protocol"));
  main.appendChild(tileGrid(PROTOCOLS.map(m=>({label:m, wide:true, sel: state.protocol===m, onClick:()=>{state.protocol=m; render();}}))));

  return main;
}

function rowTitle(txt){
  const d = document.createElement("div");
  d.className = "section-label";
  d.textContent = txt;
  return d;
}

function tile(label, selected, onClick, wide){
  const b = document.createElement("button");
  b.className = "tile" + (selected?" selected":"") + (wide?" wide":"");
  b.textContent = label;
  b.onclick = onClick;
  return b;
}

function tileGrid(items){
  const g = document.createElement("div");
  g.className = "grid";
  items.forEach(it => g.appendChild(tile(it.label, it.sel, it.onClick, it.wide)));
  return g;
}

function iconGrid(items){
  const g = document.createElement("div");
  g.className = "icon-grid";
  items.forEach(it => {
    const b = document.createElement("button");
    b.className = "icon-tile";
    b.innerHTML = `<span class="icon-tile-emoji">${it.emoji}</span><span class="icon-tile-label">${escapeHtml(it.label)}</span>`;
    b.onclick = it.onClick;
    g.appendChild(b);
  });
  return g;
}

function renderLogFlow(){
  if(state.finishStep === "details") return renderFinishDetails();
  if(state.finishStep === "review") return renderFinishReviewFinal();

  const main = document.createElement("main");

  main.appendChild(rowTitle("Sign Type"));
  main.appendChild(iconGrid(SIGN_TYPES.map(s=>({
    label: s, emoji: SIGN_EMOJI[s], onClick:()=>{ addToCart(s); }
  }))));

  main.appendChild(renderCart());

  const wrap = document.createElement("div");
  wrap.className = "logbtn-wrap";
  const finishBtn = document.createElement("button");
  finishBtn.className = "logbtn";
  finishBtn.textContent = state.cart.length
    ? `Continue (${state.cart.length}) →`
    : "Add items to start a run";
  finishBtn.disabled = state.cart.length === 0;
  finishBtn.onclick = () => { state.finishStep = "details"; render(); };
  wrap.appendChild(finishBtn);
  main.appendChild(wrap);

  return main;
}

function renderFinishDetails(){
  const main = document.createElement("main");

  const back = document.createElement("button");
  back.className = "backbtn";
  back.textContent = "‹ Back to signs";
  back.onclick = () => { state.finishStep = null; render(); };
  main.appendChild(back);

  main.appendChild(rowTitle(`Run Details (${state.cart.length} signs)`));
  groupCartBySign(state.cart).forEach(group => main.appendChild(renderQtyGroup(group)));

  main.appendChild(rowTitle("Calibration Session ID"));
  const calInput = document.createElement("input");
  calInput.type = "text";
  calInput.placeholder = "e.g. CAL-014";
  calInput.value = state.calibrationSessionId;
  calInput.oninput = (e) => { state.calibrationSessionId = e.target.value; };
  main.appendChild(calInput);

  main.appendChild(rowTitle("Capture Session ID"));
  const capInput = document.createElement("input");
  capInput.type = "text";
  capInput.placeholder = "e.g. CAP-014";
  capInput.value = state.captureSessionId;
  capInput.oninput = (e) => { state.captureSessionId = e.target.value; };
  main.appendChild(capInput);

  main.appendChild(rowTitle("Notes (details or issues, optional)"));
  const notesArea = document.createElement("textarea");
  notesArea.placeholder = "Anything worth flagging for this capture...";
  notesArea.value = state.sessionNotes;
  notesArea.oninput = (e) => { state.sessionNotes = e.target.value; };
  main.appendChild(notesArea);

  const wrap = document.createElement("div");
  wrap.className = "logbtn-wrap";
  const reviewBtn = document.createElement("button");
  reviewBtn.className = "logbtn";
  reviewBtn.textContent = "Review Run →";
  reviewBtn.onclick = () => {
    if(!state.calibrationSessionId.trim() || !state.captureSessionId.trim()){
      showToast("Calibration ID and Capture ID are required");
      return;
    }
    state.finishStep = "review";
    render();
  };
  wrap.appendChild(reviewBtn);
  main.appendChild(wrap);

  return main;
}

function renderFinishReviewFinal(){
  const main = document.createElement("main");

  const back = document.createElement("button");
  back.className = "backbtn";
  back.textContent = "‹ Back to details";
  back.onclick = () => { state.finishStep = "details"; render(); };
  main.appendChild(back);

  main.appendChild(rowTitle("Review Before Submitting"));

  const ctxBlock = document.createElement("div");
  ctxBlock.className = "reviewblock";
  ctxBlock.innerHTML = `
    <div class="rlabel">Session</div>
    <div class="rvalue">Team ${state.teamId} · ${state.protocol} · ${state.environment}</div>
    <div class="entry-meta">Kit ${state.objectKit} · Route ${escapeHtml(state.route)}</div>
    <div class="entry-meta">${escapeHtml(state.locationCity)}, ${escapeHtml(state.locationState)}</div>
    <div class="entry-meta" style="margin-top:8px;">Cal ${escapeHtml(state.calibrationSessionId)} · Cap ${escapeHtml(state.captureSessionId)}</div>
    ${state.sessionNotes ? `<div class="entry-note">Note: "${escapeHtml(state.sessionNotes)}"</div>` : ""}
  `;
  main.appendChild(ctxBlock);

  main.appendChild(rowTitle(`Signs (${state.cart.length})`));
  groupCartBySign(state.cart).forEach(group => main.appendChild(renderQtyGroup(group)));

  const wrap = document.createElement("div");
  wrap.className = "logbtn-wrap";
  const completeBtn = document.createElement("button");
  completeBtn.className = "logbtn";
  completeBtn.textContent = state.submitting ? "Saving…" : "✓ Submit Run";
  completeBtn.disabled = state.submitting;
  completeBtn.onclick = finishRound;
  wrap.appendChild(completeBtn);
  main.appendChild(wrap);

  return main;
}

function groupCartBySign(cart){
  const map = new Map();
  cart.forEach(item => {
    if(!map.has(item.signType)) map.set(item.signType, []);
    map.get(item.signType).push(item);
  });
  const groups = [...map.entries()].map(([signType, items]) => ({ signType, items }));
  groups.sort((a, b) => {
    const aLast = a.items[a.items.length - 1].timestamp;
    const bLast = b.items[b.items.length - 1].timestamp;
    return String(bLast).localeCompare(String(aLast));
  });
  return groups;
}

function renderQtyGroup(group){
  const el = document.createElement("div");
  el.className = "entry";

  el.innerHTML = `
    <div class="qty-row">
      <div class="entry-taxonomy">${SIGN_EMOJI[group.signType]||""} ${escapeHtml(group.signType)}</div>
    </div>
  `;

  const stepper = document.createElement("div");
  stepper.className = "qty-stepper";
  const minus = document.createElement("button");
  minus.className = "qty-btn";
  minus.textContent = "–";
  minus.onclick = () => decrementCartSign(group.signType);
  const count = document.createElement("span");
  count.className = "qty-count";
  count.textContent = group.items.length;
  const plus = document.createElement("button");
  plus.className = "qty-btn";
  plus.textContent = "+";
  plus.onclick = () => incrementCartSign(group.signType);
  stepper.appendChild(minus);
  stepper.appendChild(count);
  stepper.appendChild(plus);
  el.querySelector(".qty-row").appendChild(stepper);

  return el;
}

function renderCart(){
  const section = document.createElement("div");
  if(state.cart.length === 0) return section;

  section.appendChild(rowTitle(`In This Run (${state.cart.length})`));
  groupCartBySign(state.cart).forEach(group => section.appendChild(renderQtyGroup(group)));

  return section;
}

function newCartItem(signType){
  return {
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    studyId: STUDY_ID,
    date: state.date,
    timestamp: new Date().toISOString(),
    teamId: state.teamId,
    protocol: state.protocol,
    environment: state.environment,
    objectKit: state.objectKit,
    route: state.route,
    locationState: state.locationState,
    locationCity: state.locationCity,
    signType: signType
  };
}

function addToCart(signType){
  state.cart.push(newCartItem(signType));
  showToast("Added: " + signType + " (" + state.cart.length + " in run)");
  render();
}

function incrementCartSign(signType){
  state.cart.push(newCartItem(signType));
  render();
}

function decrementCartSign(signType){
  for(let i = state.cart.length - 1; i >= 0; i--){
    if(state.cart[i].signType === signType){
      state.cart.splice(i, 1);
      break;
    }
  }
  if(state.cart.length === 0) state.finishStep = null;
  render();
}

async function finishRound(){
  if(state.cart.length === 0 || state.submitting) return;
  if(!state.calibrationSessionId.trim() || !state.captureSessionId.trim()){
    showToast("Calibration ID and Capture ID are required");
    return;
  }
  const count = state.cart.length;
  const finalized = state.cart.slice().reverse().map(item => ({
    ...item,
    calibrationSessionId: state.calibrationSessionId,
    captureSessionId: state.captureSessionId,
    sessionNotes: state.sessionNotes
  }));

  state.submitting = true;
  render();

  try {
    const res = await fetch("/api/entries", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ entries: finalized, teamId: state.teamId })
    });
    if(!res.ok) throw new Error("Save failed");

    state.cart = [];
    state.finishStep = null;
    state.calibrationSessionId = "";
    state.captureSessionId = "";
    state.sessionNotes = "";
    state.submitting = false;
    // Back to the team picker for the next run — a device may be shared
    // across teams over the course of a day, so each run re-confirms who's
    // logging rather than silently continuing under whoever set up last.
    state.teamId = null;
    state.protocol = null;
    state.environment = null;
    state.objectKit = null;
    state.route = "";
    state.assignedRoutes = [];
    showToast(`Run complete — ${count} entries saved to the weekly document`);
    render();
  } catch (err) {
    state.submitting = false;
    showToast("Couldn't save — check connection and try again");
    render();
  }
}

function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(()=>{ state.toast=null; render(); }, 1800);
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(() => { if(state.tab === "weekly") fetchWeekly(); }, 20000);
}

function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}

async function fetchWeekly(){
  state.weekly.loading = true;
  render();
  try {
    const res = await fetch(`/api/entries?week=${encodeURIComponent(state.weekly.week)}&study=${encodeURIComponent(STUDY_ID)}`);
    const data = await res.json();
    state.weekly.entries = (data.entries || []).sort((a,b) => String(b.timestamp).localeCompare(String(a.timestamp)));
  } catch (err) {
    showToast("Couldn't load the weekly document");
  }
  state.weekly.loading = false;
  render();
}

async function deleteWeeklyEntry(entry){
  try {
    await fetch("/api/entries", {
      method: "DELETE",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ week: state.weekly.week, id: entry.id, studyId: STUDY_ID })
    });
    state.weekly.entries = state.weekly.entries.filter(e => e.id !== entry.id);
    render();
  } catch (err) {
    showToast("Couldn't delete — try again");
  }
}

function startEdit(entry){
  state.editingId = entry.id;
  state.editDraft = {
    signType: entry.signType,
    calibrationSessionId: entry.calibrationSessionId || "",
    captureSessionId: entry.captureSessionId || "",
    sessionNotes: entry.sessionNotes || ""
  };
  render();
}

function cancelEdit(){
  state.editingId = null;
  state.editDraft = null;
  render();
}

async function saveEdit(entry){
  try {
    const res = await fetch("/api/entries", {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ week: state.weekly.week, id: entry.id, studyId: STUDY_ID, updates: state.editDraft })
    });
    if(!res.ok) throw new Error("Save failed");
    const { entry: updated } = await res.json();
    state.weekly.entries = state.weekly.entries.map(e => e.id === entry.id ? updated : e);
    state.editingId = null;
    state.editDraft = null;
    showToast("Entry updated");
    render();
  } catch (err) {
    showToast("Couldn't save edit — try again");
  }
}

function renderWeekly(){
  const main = document.createElement("main");

  const weekBar = document.createElement("div");
  weekBar.className = "weekbar";
  weekBar.innerHTML = `<div class="weeklabel">Week <b>${state.weekly.week}</b> · all teams · ${state.weekly.entries.length} entries</div>`;
  const refreshBtn = document.createElement("button");
  refreshBtn.className = "refreshbtn";
  refreshBtn.textContent = state.weekly.loading ? "Refreshing…" : "↻ Refresh";
  refreshBtn.onclick = fetchWeekly;
  weekBar.appendChild(refreshBtn);
  main.appendChild(weekBar);

  const exportBtn = document.createElement("button");
  exportBtn.className = "exportbtn";
  exportBtn.textContent = "⬇ Download Weekly CSV (all teams)";
  exportBtn.onclick = () => {
    window.location.href = `/api/entries?week=${encodeURIComponent(state.weekly.week)}&study=${encodeURIComponent(STUDY_ID)}&format=csv`;
  };
  main.appendChild(exportBtn);

  if(state.weekly.entries.length === 0){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = state.weekly.loading ? "Loading…" : "No entries logged this week yet.";
    main.appendChild(e);
    return main;
  }

  groupIntoRounds(state.weekly.entries).forEach(round => {
    main.appendChild(renderRoundCard(round));
  });

  const adminHref = STUDY_ID === "default" ? "/admin" : `/s/${STUDY_ID}/admin`;
  const footer = document.createElement("div");
  footer.style.cssText = "text-align:center;margin-top:24px;";
  footer.innerHTML = `<a href="${adminHref}" style="color:var(--ink-soft);font-size:12px;text-decoration:underline;">Team lead? Open admin dashboard →</a>`;
  main.appendChild(footer);

  return main;
}

function groupIntoRounds(entries){
  const map = new Map();
  entries.forEach(e => {
    const key = `${e.teamId}::${e.captureSessionId || e.calibrationSessionId || e.id}`;
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(e);
  });
  const rounds = [...map.values()];
  rounds.forEach(r => r.sort((a,b) => String(a.timestamp).localeCompare(String(b.timestamp))));
  rounds.sort((a,b) => String(b[b.length-1].timestamp).localeCompare(String(a[a.length-1].timestamp)));
  return rounds;
}

function groupEntriesBySign(entries){
  const map = new Map();
  entries.forEach(e => {
    if(!map.has(e.signType)) map.set(e.signType, []);
    map.get(e.signType).push(e);
  });
  const groups = [...map.entries()].map(([signType, items]) => ({
    signType,
    items: items.slice().sort((a,b) => String(a.timestamp).localeCompare(String(b.timestamp)))
  }));
  groups.sort((a,b) => String(b.items[b.items.length-1].timestamp).localeCompare(String(a.items[a.items.length-1].timestamp)));
  return groups;
}

function renderRoundCard(round){
  const first = round[0];
  const card = document.createElement("div");
  card.className = "entry";

  const time = new Date(first.timestamp).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  const header = document.createElement("div");
  header.innerHTML = `
    <div class="entry-taxonomy"><span class="teampill">Team ${first.teamId}</span>${round.length} sign${round.length===1?"":"s"}</div>
    <div class="entry-meta">${time} · ${first.protocol} · ${first.environment} · Kit ${first.objectKit} · Rt ${escapeHtml(first.route)}</div>
    <div class="entry-meta">Cal ${escapeHtml(first.calibrationSessionId||"")} · Cap ${escapeHtml(first.captureSessionId||"")}</div>
    ${first.sessionNotes ? `<div class="entry-note">Session: "${escapeHtml(first.sessionNotes)}"</div>` : ""}
  `;
  card.appendChild(header);

  const signList = document.createElement("div");
  signList.style.cssText = "margin-top:10px;border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:8px;";

  groupEntriesBySign(round).forEach(group => {
    const latest = group.items[group.items.length - 1];

    if(state.editingId === latest.id){
      signList.appendChild(renderEditForm(latest));
      return;
    }

    const row = document.createElement("div");
    row.style.cssText = "display:flex;justify-content:space-between;align-items:flex-start;gap:8px;";

    const editedTag = latest.editedAt ? ` · edited ${new Date(latest.editedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}` : "";
    const left = document.createElement("div");
    left.innerHTML = `
      <div style="font-size:13.5px;font-weight:600;">${SIGN_EMOJI[group.signType]||""} ${escapeHtml(group.signType)}${group.items.length>1 ? `<span class="countbadge">×${group.items.length}</span>` : ""}</div>
      <div class="entry-meta" style="margin-top:2px;">${new Date(latest.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}${editedTag}</div>
    `;
    row.appendChild(left);

    if(latest.teamId === state.teamId){
      const btnRow = document.createElement("div");
      btnRow.style.cssText = "display:flex;gap:6px;flex-shrink:0;";
      const editBtn = document.createElement("button");
      editBtn.className = "backbtn";
      editBtn.style.cssText = "margin-bottom:0;padding:6px 10px;font-size:12px;";
      editBtn.textContent = "Edit";
      editBtn.onclick = () => startEdit(latest);
      const delBtn = document.createElement("button");
      delBtn.className = "delbtn";
      delBtn.style.cssText = "padding:6px 10px;font-size:12px;";
      delBtn.textContent = group.items.length > 1 ? "Delete one" : "Delete";
      delBtn.onclick = () => deleteWeeklyEntry(latest);
      btnRow.appendChild(editBtn);
      btnRow.appendChild(delBtn);
      row.appendChild(btnRow);
    }

    signList.appendChild(row);
  });

  card.appendChild(signList);
  return card;
}

function renderEditForm(entry){
  const wrap = document.createElement("div");

  wrap.appendChild(rowTitle("Sign Type"));
  const select = document.createElement("select");
  SIGN_TYPES.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s; opt.textContent = `${SIGN_EMOJI[s]} ${s}`;
    if(s === state.editDraft.signType) opt.selected = true;
    select.appendChild(opt);
  });
  select.onchange = (e) => { state.editDraft.signType = e.target.value; };
  wrap.appendChild(select);

  wrap.appendChild(rowTitle("Calibration Session ID"));
  const calInput = document.createElement("input");
  calInput.type = "text";
  calInput.value = state.editDraft.calibrationSessionId;
  calInput.oninput = (e) => { state.editDraft.calibrationSessionId = e.target.value; };
  wrap.appendChild(calInput);

  wrap.appendChild(rowTitle("Capture Session ID"));
  const capInput = document.createElement("input");
  capInput.type = "text";
  capInput.value = state.editDraft.captureSessionId;
  capInput.oninput = (e) => { state.editDraft.captureSessionId = e.target.value; };
  wrap.appendChild(capInput);

  wrap.appendChild(rowTitle("Session Notes"));
  const sessionNotesInput = document.createElement("textarea");
  sessionNotesInput.value = state.editDraft.sessionNotes;
  sessionNotesInput.oninput = (e) => { state.editDraft.sessionNotes = e.target.value; };
  wrap.appendChild(sessionNotesInput);

  const btnRow = document.createElement("div");
  btnRow.style.cssText = "display:flex;gap:8px;margin-top:14px;";
  const saveBtn = document.createElement("button");
  saveBtn.className = "logbtn";
  saveBtn.style.cssText = "flex:1;padding:12px;";
  saveBtn.textContent = "Save";
  saveBtn.onclick = () => saveEdit(entry);
  const cancelBtn = document.createElement("button");
  cancelBtn.className = "backbtn";
  cancelBtn.style.cssText = "flex:1;margin-bottom:0;";
  cancelBtn.textContent = "Cancel";
  cancelBtn.onclick = cancelEdit;
  btnRow.appendChild(saveBtn);
  btnRow.appendChild(cancelBtn);
  wrap.appendChild(btnRow);

  return wrap;
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

render();
if(STUDY_ID !== "default") loadStudy();
else fetchAssignments();
</script>
</body>

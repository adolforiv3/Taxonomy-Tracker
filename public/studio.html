<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxonomy Logger — Study Builder</title>
<style>
  :root{
    --paper:#f5f5f7; --paper-line: rgba(0,0,0,0.05); --ink:#1d1d1f; --ink-soft:#6e6e73;
    --teal:#5e5ce6; --teal-dark:#4a48c4; --teal-bg: rgba(94,92,230,0.1);
    --red:#ff3b30; --red-bg: rgba(255,59,48,0.12);
    --card:#ffffff; --border: rgba(0,0,0,0.09);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 6px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.16), 0 2px 8px rgba(0,0,0,0.08);
    --r-sm:10px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#000000; --paper-line: rgba(255,255,255,0.07); --ink:#f5f5f7; --ink-soft:#98989d;
      --teal:#7d7aff; --teal-dark:#a5a3ff; --teal-bg: rgba(125,122,255,0.18);
      --red:#ff453a; --red-bg: rgba(255,69,58,0.16);
      --card:#1c1c1e; --border: rgba(255,255,255,0.12);
      --shadow-sm: 0 0 0 1px rgba(255,255,255,0.06);
      --shadow-md: 0 0 0 1px rgba(255,255,255,0.06), 0 8px 24px rgba(0,0,0,0.5);
      --shadow-lg: 0 0 0 1px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
    }
  }
  *{box-sizing:border-box;}
  button:not(:disabled){cursor:pointer;}
  @media (hover:hover){ button:not(:disabled):hover{ filter:brightness(0.94); transition:filter .15s ease; } }
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);min-height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;color-scheme:light;}
  @media (prefers-color-scheme: dark){ html,body{color-scheme:dark;} }

  header{padding:20px 28px;display:flex;align-items:baseline;gap:10px;justify-content:space-between;}
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.02em;}
  header .sub{font-size:12px;color:var(--teal);font-weight:600;letter-spacing:.02em;}
  header .userinfo{font-size:12px;color:var(--ink-soft);display:flex;gap:12px;align-items:center;}
  header .userinfo button{background:transparent;border:none;color:var(--teal);font-size:12px;font-weight:600;padding:0;margin:0;}

  main{max-width:900px;margin:0 auto;padding:8px 28px 60px;}

  .authbox{max-width:360px;margin:80px auto;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
    padding:28px;box-shadow:var(--shadow-md);}
  .authbox h2{font-size:16px;margin:0 0 6px;font-weight:700;letter-spacing:-0.01em;}
  .authbox p{font-size:13px;color:var(--ink-soft);margin:0 0 18px;}
  .authbox input{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:16px;margin-bottom:12px;
    background:var(--card);color:var(--ink);}
  .authbox input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-bg);}
  .authbox button{width:100%;padding:13px;border:none;border-radius:var(--r-sm);background:var(--teal);color:#fff;
    font-weight:600;font-size:14px;margin-bottom:8px;}
  .authbox .toggle{text-align:center;font-size:12.5px;color:var(--ink-soft);}
  .authbox .toggle button{width:auto;background:none;color:var(--teal);padding:0;margin:0;text-decoration:underline;}
  .authbox .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;
    box-shadow:var(--shadow-sm);}
  .card h2{font-size:16px;margin:0 0 16px;font-weight:700;letter-spacing:-0.01em;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);
    font-weight:700;margin-bottom:6px;}
  .field input, .field textarea{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-sm);
    font-size:15px;font-family:inherit;background:var(--paper);color:var(--ink);}
  .field input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-bg);}
  .field label .optional{text-transform:none;font-weight:500;color:var(--ink-soft);letter-spacing:0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

  .datewrap input{cursor:pointer;}
  .datewrap input::-webkit-calendar-picker-indicator{cursor:pointer;padding:4px;border-radius:6px;
    transition:background .15s ease;}
  @media (hover:hover){ .datewrap input::-webkit-calendar-picker-indicator:hover{background:var(--teal-bg);} }

  .listrow{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .listrow input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;
    background:var(--paper);color:var(--ink);font-family:inherit;}
  .listrow input.emoji{flex:0 0 60px;text-align:center;}
  .listrow .rmbtn{background:transparent;border:1px solid var(--border);color:var(--red);border-radius:var(--r-sm);
    padding:8px 10px;font-size:12px;font-weight:700;flex-shrink:0;cursor:pointer;transition:background .15s ease,border-color .15s ease;}
  .listrow .rmbtn:hover{background:var(--red-bg);border-color:var(--red);}
  .addbtn{background:var(--teal-bg);color:var(--teal-dark);border:1px dashed var(--teal);border-radius:var(--r-sm);
    padding:9px 14px;font-size:12.5px;font-weight:600;width:100%;margin-top:4px;}

  .launchbtn{width:100%;padding:15px;border:none;border-radius:var(--r-sm);background:var(--ink);color:var(--card);
    font-weight:700;font-size:15px;margin-top:8px;}
  .launchbtn:disabled{background:var(--border);color:var(--ink-soft);}

  .result{background:var(--teal-bg);border:1px solid var(--teal);border-radius:var(--r-md);padding:16px;margin-top:16px;}
  .result .linkrow{display:flex;align-items:center;gap:8px;margin-top:8px;background:var(--card);border:1px solid var(--border);
    border-radius:var(--r-sm);padding:9px 12px;}
  .result .linkrow code{flex:1;font-size:12.5px;overflow-x:auto;white-space:nowrap;color:var(--ink);}
  .result .linkrow button{background:var(--teal);color:#fff;border:none;border-radius:var(--r-sm);padding:6px 12px;
    font-size:11.5px;font-weight:600;flex-shrink:0;}

  .studylist{display:flex;flex-direction:column;gap:10px;}
  .studyrow{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;
    box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .studyrow .name{font-weight:700;font-size:14.5px;}
  .studyrow .meta{font-size:12.5px;color:var(--ink-soft);}
  .studyrow .actions{margin-left:auto;display:flex;gap:6px;}
  .studyrow button{background:transparent;border:1px solid var(--border);color:var(--teal);border-radius:var(--r-sm);
    padding:7px 12px;font-size:12px;font-weight:600;transition:background .15s ease,border-color .15s ease;}
  .studyrow button.del{color:var(--red);}
  @media (hover:hover){ .studyrow button.del:hover{ background:var(--red-bg); border-color:var(--red); } }
  .empty{color:var(--ink-soft);text-align:center;padding:30px 0;font-size:13.5px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
const EXAMPLE_PROTOCOLS = "Walk, Exploration, Fast-Walk";
const EXAMPLE_ENVIRONMENTS = "Urban Street, Near Restaurant, Popular Landmark, Near Corporate, Residential, Parking Garages and Parking Lots, City Parks, Gas Station";
const EXAMPLE_SIGN_TYPES = "Construction Sign, Crosswalk, Stop Sign, Bench, Storm Drain, Street Tree, Bike Rack, Public Art, Trash Receptacle, Fire Hydrant …";

function blankForm(){
  return {
    editingId: null,
    name: "", dateStart: "", dateEnd: "", passcode: "", teamCount: 0,
    protocols: [],
    environments: [],
    objectKitCount: 0,
    signTypes: []
  };
}

let state = {
  user: null,
  token: sessionStorage.getItem("tl_token"),
  authMode: "login", // "login" or "bootstrap"
  authErr: "",
  bootstrapErr: "",
  adminTab: "studies", // "studies" or "users" (for superadmin)
  users: [],
  studies: [],
  loading: false,
  saving: false,
  launchResult: null,
  reviewingStudy: false,
  form: blankForm(),
  managingAssignmentsFor: null, // study id, or null
  managingLabAdminsFor: null, // study id, or null (superadmin only)
  managingLocationsFor: null, // study id, or null (DRI/superadmin only)
  assignmentDate: new Date().toISOString().slice(0, 10),
  assignments: [],
  assignmentsLoading: false,
  assignmentRoutesDraft: [{ route: "", environment: "" }], // primary + optional backups, built up in the create form
  locationDraft: { date: new Date().toISOString().slice(0, 10), state: "", city: "" },
  editingLocationId: null // location schedule entry id currently being edited inline, or null
};

const app = document.getElementById("app");

async function checkBootstrapNeeded(){
  // Check if any superadmin exists
  try {
    const res = await fetch("/api/users", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "listUsers" })
    });
    // If 403, bootstrap is needed (no superadmin exists and we're not authed)
    if(res.status === 403) return true;
    return false;
  } catch {
    return false;
  }
}

async function init(){
  // Check if user is already logged in
  if(state.token){
    try {
      const res = await fetch("/api/users", {
        method: "POST",
        headers: { "content-type": "application/json", "x-user-token": state.token },
        body: JSON.stringify({ action: "whoami" })
      });
      if(res.ok){
        const data = await res.json();
        state.user = data.user;
        if(data.user.role === "superadmin") fetchUsers();
        fetchStudies();
      } else {
        state.token = null;
        sessionStorage.removeItem("tl_token");
      }
    } catch (err) {
      state.token = null;
      sessionStorage.removeItem("tl_token");
    }
  } else {
    // Check if bootstrap is needed
    const needsBootstrap = await checkBootstrapNeeded();
    if(needsBootstrap) state.authMode = "bootstrap";
  }
  render();
}

function render(){
  app.innerHTML = "";
  if(state.user){
    app.appendChild(renderDashboard());
  } else {
    app.appendChild(renderAuthScreen());
  }
}

function renderAuthScreen(){
  const wrap = document.createElement("div");
  wrap.innerHTML = `<header><h1>Taxonomy Logger</h1><span class="sub">Study Builder</span></header>`;

  const main = document.createElement("main");
  const box = document.createElement("div");
  box.className = "authbox";

  if(state.authMode === "bootstrap"){
    box.innerHTML = `
      <h2>Set Up Superadmin Account</h2>
      <p>Create the first account to get started. A master passcode is required.</p>
      <input id="bootstrapEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="bootstrapPassword" type="password" placeholder="Password (6+ chars)" autocomplete="new-password" />
      <input id="bootstrapMasterPasscode" type="password" placeholder="Master Passcode" autocomplete="off" />
      <button id="bootstrapBtn">Create Superadmin</button>
      <div class="err">${state.bootstrapErr}</div>
    `;
    box.querySelector("#bootstrapBtn").onclick = tryBootstrap;
    box.querySelector("#bootstrapEmail").addEventListener("keydown", (e) => { if(e.key === "Enter") tryBootstrap(); });
  } else {
    box.innerHTML = `
      <h2>DRI / Lab Admin Access</h2>
      <p>Log in to manage studies.</p>
      <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn">Log In</button>
      <div class="err">${state.authErr}</div>
    `;
    box.querySelector("#loginBtn").onclick = tryLogin;
    box.querySelector("#loginEmail").addEventListener("keydown", (e) => { if(e.key === "Enter") tryLogin(); });
  }

  main.appendChild(box);
  wrap.appendChild(main);
  return wrap;
}

async function tryBootstrap(){
  const email = document.getElementById("bootstrapEmail")?.value || "";
  const password = document.getElementById("bootstrapPassword")?.value || "";
  const masterPasscode = document.getElementById("bootstrapMasterPasscode")?.value || "";

  if(!email.trim() || !password.trim() || !masterPasscode.trim()){
    state.bootstrapErr = "All fields are required";
    render();
    return;
  }

  try {
    const res = await fetch("/api/users", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "bootstrap", email: email.trim(), password, masterPasscode })
    });
    const data = await res.json();
    if(!res.ok){
      state.bootstrapErr = data.error || "Bootstrap failed";
      render();
    } else {
      state.token = data.token;
      state.user = data.user;
      sessionStorage.setItem("tl_token", state.token);
      state.authErr = "";
      state.bootstrapErr = "";
      state.authMode = "login";
      render();
      fetchStudies();
    }
  } catch (err) {
    state.bootstrapErr = "Couldn't reach server";
    render();
  }
}


async function tryLogin(){
  const email = document.getElementById("loginEmail")?.value || "";
  const password = document.getElementById("loginPassword")?.value || "";

  if(!email.trim() || !password.trim()){
    state.authErr = "Email and password required";
    render();
    return;
  }

  try {
    const res = await fetch("/api/users", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ action: "login", email: email.trim(), password })
    });
    const data = await res.json();
    if(!res.ok){
      state.authErr = "Invalid email or password";
      render();
    } else {
      state.token = data.token;
      state.user = data.user;
      sessionStorage.setItem("tl_token", state.token);
      state.authErr = "";
      state.authMode = "login";
      render();
      fetchStudies();
    }
  } catch (err) {
    state.authErr = "Couldn't reach server";
    render();
  }
}

function logout(){
  state.user = null;
  state.token = null;
  sessionStorage.removeItem("tl_token");
  state.form = blankForm();
  state.launchResult = null;
  state.reviewingStudy = false;
  state.authErr = "";
  state.authMode = "login";
  render();
}

function renderDashboard(){
  const wrap = document.createElement("div");
  const header = document.createElement("header");
  const titleDiv = document.createElement("div");
  titleDiv.innerHTML = `<h1>Taxonomy Logger</h1><span class="sub">Study Builder</span>`;
  header.appendChild(titleDiv);

  const userinfo = document.createElement("div");
  userinfo.className = "userinfo";
  userinfo.innerHTML = `<span>${escapeHtml(state.user.email)}</span>`;
  if(state.user.role === "superadmin"){
    const studiesTabBtn = document.createElement("button");
    studiesTabBtn.textContent = "Studies";
    studiesTabBtn.style.cssText = `${state.adminTab === "studies" ? "color: var(--teal-dark);" : ""}`;
    studiesTabBtn.onclick = () => { state.adminTab = "studies"; render(); };
    const usersTabBtn = document.createElement("button");
    usersTabBtn.textContent = "Users";
    usersTabBtn.style.cssText = `${state.adminTab === "users" ? "color: var(--teal-dark);" : ""}`;
    usersTabBtn.onclick = () => { state.adminTab = "users"; fetchUsers(); render(); };
    userinfo.appendChild(studiesTabBtn);
    userinfo.appendChild(usersTabBtn);
  }
  const logoutBtn = document.createElement("button");
  logoutBtn.textContent = "Log Out";
  logoutBtn.onclick = logout;
  userinfo.appendChild(logoutBtn);
  header.appendChild(userinfo);
  wrap.appendChild(header);

  const main = document.createElement("main");
  if(state.user.role === "superadmin" && state.adminTab === "users"){
    main.appendChild(renderUserManagement());
  } else if(state.managingAssignmentsFor){
    main.appendChild(renderAssignmentsView());
  } else if(state.managingLabAdminsFor){
    main.appendChild(renderLabAdminManagement());
  } else if(state.managingLocationsFor){
    main.appendChild(renderLocationsView());
  } else if(state.reviewingStudy){
    main.appendChild(renderStudyReview());
  } else {
    // Lab Admins manage assignments within studies they've been given
    // access to, but don't create studies themselves — that's the DRI's
    // (or a superadmin's) job.
    if(state.user.role !== "lab_admin"){
      main.appendChild(renderForm());
    }
    main.appendChild(renderStudyList());
  }
  wrap.appendChild(main);
  return wrap;
}

function renderForm(){
  const f = state.form;
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<h2>${f.editingId ? "Edit Study" : "Create New Study"}</h2>`;

  const nameField = fieldInput("Study Name", "text", f.name, v => f.name = v, "e.g. Downtown Signage Survey — Summer 2026");
  card.appendChild(nameField);

  const row2 = document.createElement("div");
  row2.className = "row2";
  row2.appendChild(fieldInput("Start Date", "date", f.dateStart, v => f.dateStart = v));
  row2.appendChild(fieldInput('End Date <span class="optional">(Optional)</span>', "date", f.dateEnd, v => f.dateEnd = v));
  card.appendChild(row2);

  const row3 = document.createElement("div");
  row3.className = "row2";
  row3.appendChild(fieldInput("Admin Passcode (for this study)", "text", f.passcode, v => f.passcode = v));
  row3.appendChild(fieldInput("Team Count", "number", f.teamCount, v => f.teamCount = Number(v) || 0));
  card.appendChild(row3);

  card.appendChild(fieldInput("Object Kit Count", "number", f.objectKitCount, v => f.objectKitCount = Number(v) || 0));

  card.appendChild(listEditor("Protocols", f.protocols, () => f.protocols.push(""), (i) => f.protocols.splice(i,1), EXAMPLE_PROTOCOLS));
  card.appendChild(listEditor("Environment Types", f.environments, () => f.environments.push(""), (i) => f.environments.splice(i,1), EXAMPLE_ENVIRONMENTS));
  card.appendChild(signTypeEditor(f));

  const launchBtn = document.createElement("button");
  launchBtn.className = "launchbtn";
  launchBtn.textContent = "Review Study →";
  launchBtn.onclick = () => {
    const passcodeRequired = !f.editingId;
    if(!f.name.trim() || (passcodeRequired && !f.passcode.trim())){
      alert("Study Name and Admin Passcode are required.");
      return;
    }
    state.reviewingStudy = true;
    render();
  };
  card.appendChild(launchBtn);

  if(f.editingId){
    const cancelBtn = document.createElement("button");
    cancelBtn.className = "launchbtn";
    cancelBtn.style.cssText = "background:transparent;color:var(--ink-soft);border:1px solid var(--border);margin-top:8px;";
    cancelBtn.textContent = "Cancel Edit";
    cancelBtn.onclick = () => { state.form = blankForm(); state.launchResult = null; state.reviewingStudy = false; render(); };
    card.appendChild(cancelBtn);
  }

  if(state.launchResult){
    const result = document.createElement("div");
    result.className = "result";
    const origin = window.location.origin;
    result.innerHTML = `
      <div style="font-weight:700;font-size:13.5px;">Study saved: ${escapeHtml(state.launchResult.name)}</div>
      <div class="linkrow"><code>${origin}/s/${state.launchResult.id}</code><button data-copy="${origin}/s/${state.launchResult.id}">Copy Field Link</button></div>
      <div class="linkrow"><code>${origin}/s/${state.launchResult.id}/admin</code><button data-copy="${origin}/s/${state.launchResult.id}/admin">Copy Admin Link</button></div>
    `;
    result.querySelectorAll("button[data-copy]").forEach(btn => {
      btn.onclick = () => { navigator.clipboard.writeText(btn.dataset.copy); btn.textContent = "Copied!"; setTimeout(() => render(), 1200); };
    });
    card.appendChild(result);
  }

  return card;
}

function fieldInput(label, type, value, onChange, placeholder){
  const wrap = document.createElement("div");
  wrap.className = "field";
  const lbl = document.createElement("label");
  lbl.innerHTML = label;
  wrap.appendChild(lbl);

  const input = document.createElement("input");
  input.type = type;
  input.value = value;
  if(placeholder) input.placeholder = placeholder;
  input.oninput = (e) => onChange(e.target.value);

  if(type === "date"){
    const dateWrap = document.createElement("div");
    dateWrap.className = "datewrap";
    input.onclick = () => { if(input.showPicker) input.showPicker(); };
    dateWrap.appendChild(input);
    wrap.appendChild(dateWrap);
  } else {
    wrap.appendChild(input);
  }

  return wrap;
}

function listEditor(label, arr, onAdd, onRemove, exampleText){
  const wrap = document.createElement("div");
  wrap.className = "field";
  const lbl = document.createElement("label");
  lbl.textContent = `${label} (${arr.length})`;
  wrap.appendChild(lbl);

  if(arr.length === 0 && exampleText){
    const hint = document.createElement("div");
    hint.style.cssText = "font-size:12px;color:var(--ink-soft);margin-bottom:8px;";
    hint.textContent = `Examples: ${exampleText}`;
    wrap.appendChild(hint);
  }

  arr.forEach((val, i) => {
    const row = document.createElement("div");
    row.className = "listrow";
    const input = document.createElement("input");
    input.type = "text";
    input.value = val;
    input.oninput = (e) => { arr[i] = e.target.value; };
    row.appendChild(input);
    const rm = document.createElement("button");
    rm.className = "rmbtn";
    rm.textContent = "Remove";
    rm.onclick = () => { onRemove(i); render(); };
    row.appendChild(rm);
    wrap.appendChild(row);
  });

  const addBtn = document.createElement("button");
  addBtn.className = "addbtn";
  addBtn.textContent = `+ Add ${label.replace(/s$/,"")}`;
  addBtn.onclick = () => { onAdd(); render(); };
  wrap.appendChild(addBtn);

  return wrap;
}

function signTypeEditor(f){
  const wrap = document.createElement("div");
  wrap.className = "field";
  const lbl = document.createElement("label");
  lbl.textContent = `Taxonomy (${f.signTypes.length})`;
  wrap.appendChild(lbl);

  const sub = document.createElement("div");
  sub.style.cssText = "font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;margin-top:-4px;";
  sub.textContent = "An emoji is picked automatically for each item once the study is saved.";
  wrap.appendChild(sub);

  if(f.signTypes.length === 0){
    const hint = document.createElement("div");
    hint.style.cssText = "font-size:12px;color:var(--ink-soft);margin-bottom:8px;";
    hint.textContent = `Examples: ${EXAMPLE_SIGN_TYPES}`;
    wrap.appendChild(hint);
  }

  f.signTypes.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "listrow";
    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = s.name;
    nameInput.placeholder = "Taxonomy item name";
    nameInput.oninput = (e) => { s.name = e.target.value; };
    row.appendChild(nameInput);
    const rm = document.createElement("button");
    rm.className = "rmbtn";

async function saveStudy(){
  const f = state.form;
  const passcodeRequired = !f.editingId;
  if(!f.name.trim() || (passcodeRequired && !f.passcode.trim())){
    alert("Study Name and Admin Passcode are required.");
    return;
  }
  state.saving = true;
  render();

  const payload = {
    name: f.name.trim(), dateStart: f.dateStart, dateEnd: f.dateEnd,
    teamCount: f.teamCount,
    protocols: f.protocols.filter(p => p.trim()),
    environments: f.environments.filter(e => e.trim()),
    objectKitCount: f.objectKitCount,
    signTypes: f.signTypes.filter(s => s.name.trim())
  };
  if(f.passcode.trim()) payload.passcode = f.passcode.trim();

  try {
    let res;
    const headers = { "content-type": "application/json", "x-user-token": state.token };
    if(f.editingId){
      res = await fetch("/api/studies", {
        method: "PATCH",
        headers,
        body: JSON.stringify({ id: f.editingId, updates: payload })
      });
    } else {
      res = await fetch("/api/studies", {
        method: "POST",
        headers,
        body: JSON.stringify(payload)
      });
    }
    if(!res.ok) throw new Error("Save failed");
    const data = await res.json();
    state.launchResult = data.study;
    state.form = blankForm();
    state.saving = false;
    state.reviewingStudy = false;
    fetchStudies();
  } catch (err) {
    state.saving = false;
    alert("Couldn't save study — check connection and try again.");
    render();
  }
}

async function createUser(email, password, role){
  email = email.trim().toLowerCase();

    alert("Valid email and password (6+ chars) required");

  try {
    const res = await fetch("/api/users", {
      method: "POST",
      headers: { "content-type": "application/json", "x-user-token": state.token },
      body: JSON.stringify({ action: "createUser", email, password, role })
    });

function routesEditor(routes, environments){
  const wrap = document.createElement("div");
  wrap.className = "field";
  const lbl = document.createElement("label");
  lbl.textContent = `Routes (${routes.length})`;
  wrap.appendChild(lbl);

  const hint = document.createElement("div");
  hint.style.cssText = "font-size:11.5px;color:var(--ink-soft);margin-bottom:8px;margin-top:-4px;line-height:1.4;";
  hint.textContent = "The first route is the Primary. Add backups for when the primary is obstructed or is compromising data accuracy — each can have its own environment.";
  wrap.appendChild(hint);

  routes.forEach((r, i) => {
    if(!r.environment) r.environment = environments[0] || "";

    const row = document.createElement("div");
    row.style.cssText = "border:1px solid var(--border);border-radius:var(--r-sm);padding:12px;margin-bottom:10px;";

    const label = document.createElement("div");
    label.style.cssText = "font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--teal-dark);margin-bottom:8px;";
    label.textContent = i === 0 ? "Primary Route" : `Backup Route ${i}`;
    row.appendChild(label);

    const routeInput = document.createElement("input");
    routeInput.type = "text";
    routeInput.placeholder = "e.g. Main St Loop";
    routeInput.value = r.route;
    routeInput.style.cssText = "width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;background:var(--paper);color:var(--ink);margin-bottom:8px;";
    routeInput.oninput = (e) => { r.route = e.target.value; };
    row.appendChild(routeInput);

    const envSelect = document.createElement("select");
    envSelect.style.cssText = "width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:14px;background:var(--paper);color:var(--ink);";
    environments.forEach(e => {
      const opt = document.createElement("option");
      opt.value = e;
      opt.textContent = e;
      if(e === r.environment) opt.selected = true;
      envSelect.appendChild(opt);
    });
    envSelect.onchange = (e) => { r.environment = e.target.value; };
    row.appendChild(envSelect);

    if(routes.length > 1){
      const rmBtn = document.createElement("button");
      rmBtn.className = "rmbtn";
      rmBtn.textContent = "Remove Route";
      rmBtn.style.cssText += "margin-top:8px;";
      rmBtn.onclick = () => { routes.splice(i, 1); render(); };
      row.appendChild(rmBtn);
    }

    wrap.appendChild(row);
  });

  const addBtn = document.createElement("button");
  addBtn.className = "addbtn";
  addBtn.textContent = "+ Add Backup Route";
  addBtn.onclick = () => { routes.push({ route: "", environment: environments[0] || "" }); render(); };
  wrap.appendChild(addBtn);

  return wrap;
}

async function createAssignment(studyId, teamId, kitNumber, routes, errEl){

    const res = await fetch("/api/assignments", {
      method: "POST",
      headers: { "content-type": "application/json", "x-user-token": state.token },
      body: JSON.stringify({ studyId, date: state.assignmentDate, teamId, kitNumber, routes })
    });
    const data = await res.json();
    if(!res.ok){
      if(errEl) errEl.textContent = data.error || "Couldn't create assignment";
      else alert(data.error || "Couldn't create assignment");
      return;
    }
    state.assignmentRoutesDraft = blankRoutesDraft();
    fetchAssignmentsForStudy(studyId);
  } catch (err) {
    if(errEl) errEl.textContent = "Couldn't reach server";
  }
}

async function deleteAssignment(studyId, id, teamId){
  if(!confirm(`Remove ${teamId}'s assignment for ${state.assignmentDate}?`)) return;
  try {
    const res = await fetch("/api/assignments", {
      method: "DELETE",
      headers: { "content-type": "application/json", "x-user-token": state.token },
      body: JSON.stringify({ studyId, id })
    });
    if(!res.ok){
      const data = await res.json().catch(() => ({}));
      alert(data.error || "Couldn't remove assignment");
      return;
    }
    state.assignments = state.assignments.filter(a => a.id !== id);

  } catch (err) {
    alert("Couldn't reach server");

}

      actions.className = "actions";
      const removeBtn = document.createElement("button");
      removeBtn.className = "del";
      removeBtn.textContent = "Remove";
      removeBtn.onclick = () => removeLabAdmin(studyId, id);
      actions.appendChild(removeBtn);
      row.appendChild(actions);
      list.appendChild(row);
    });
    assignedSection.appendChild(list);
  }
  card.appendChild(assignedSection);

  const addSection = document.createElement("div");
  addSection.innerHTML = `<h3 style="font-size:14px;margin:0 0 12px;font-weight:700;">Add Lab Admin</h3>`;
  const available = labAdminUsers.filter(u => !assignedIds.includes(u.id));
  if(available.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = labAdminUsers.length === 0
      ? "No lab admin accounts exist yet — create one in the Users tab."
      : "All lab admin accounts are already assigned to this study.";
    addSection.appendChild(empty);
  } else {
    const select = document.createElement("select");
    select.style.cssText = "width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:15px;background:var(--paper);color:var(--ink);margin-bottom:10px;";
    available.forEach(u => {
      const opt = document.createElement("option");
      opt.value = u.id;
      opt.textContent = u.email;
      select.appendChild(opt);
    });
    addSection.appendChild(select);

    const addBtn = document.createElement("button");
    addBtn.className = "launchbtn";
    addBtn.textContent = "Add Lab Admin";
    addBtn.onclick = () => addLabAdmin(studyId, select.value);
    addSection.appendChild(addBtn);
  }
  card.appendChild(addSection);

  return card;
}

async function patchLabAdminIds(studyId, labAdminIds){
  try {
    const res = await fetch("/api/studies", {
      method: "PATCH",
      headers: { "content-type": "application/json", "x-user-token": state.token },
      body: JSON.stringify({ id: studyId, updates: { labAdminIds } })
    });
    const data = await res.json();
    if(!res.ok){
      alert(data.error || "Couldn't update lab admins");
      return;
    }
    const idx = state.studies.findIndex(s => s.id === studyId);
    if(idx !== -1) state.studies[idx] = { ...state.studies[idx], labAdminIds };
    render();
  } catch (err) {
    alert("Couldn't reach server");
  }
}

function addLabAdmin(studyId, userId){
  const study = state.studies.find(s => s.id === studyId);
  if(!study) return;
  const next = [...new Set([...(study.labAdminIds || []), userId])];
  patchLabAdminIds(studyId, next);
}

function removeLabAdmin(studyId, userId){
  const study = state.studies.find(s => s.id === studyId);
  if(!study) return;
  const next = (study.labAdminIds || []).filter(id => id !== userId);
  patchLabAdminIds(studyId, next);
}

// Same ISO-week convention the field app and CSV export already use, so a
// location scheduled here lines up with the same week those group entries by.
function isoWeek(dateStr){
  const d = new Date(dateStr + "T00:00:00Z");
  const target = new Date(d.valueOf());
  const dayNr = (d.getUTCDay() + 6) % 7;
  target.setUTCDate(target.getUTCDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setUTCMonth(0, 1);
  if(target.getUTCDay() !== 4){ target.setUTCMonth(0, 1 + ((4 - target.getUTCDay() + 7) % 7)); }
  const week = 1 + Math.ceil((firstThursday - target.valueOf()) / (7*24*3600*1000));
  return `${d.getUTCFullYear()}-W${String(week).padStart(2,"0")}`;
}

function openLocations(studyId){
  state.managingLocationsFor = studyId;
  state.locationDraft = { date: new Date().toISOString().slice(0, 10), state: "", city: "" };
  state.editingLocationId = null;
  render();
}

function renderLocationsView(){
  const studyId = state.managingLocationsFor;
  const study = state.studies.find(s => s.id === studyId);
  const card = document.createElement("div");
  card.className = "card";

  if(!study){
    card.innerHTML = `<h2>Locations</h2><div class="empty">Study not found.</div>`;
    return card;
  }

  card.innerHTML = `<h2>Locations — ${escapeHtml(study.name)}</h2>`;

  const backBtn = document.createElement("button");
  backBtn.className = "launchbtn";
  backBtn.style.cssText = "background:transparent;color:var(--ink-soft);border:1px solid var(--border);margin-bottom:18px;";
  backBtn.textContent = "‹ Back to Studies";
  backBtn.onclick = () => { state.managingLocationsFor = null; render(); };
  card.appendChild(backBtn);

  const intro = document.createElement("div");
  intro.style.cssText = "font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;line-height:1.5;";
  intro.textContent = "A study can span multiple weeks in different places as the team travels. Schedule a state/city per week — pick any date in that week. Locations can be edited any time if plans pivot; protocols and taxonomy stay fixed for the whole study.";
  card.appendChild(intro);

  const schedule = (study.locationSchedule || []).slice().sort((a, b) => a.week.localeCompare(b.week));

  const addSection = document.createElement("div");
  addSection.style.cssText = "padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px;";
  addSection.innerHTML = `<h3 style="font-size:14px;margin:0 0 12px;font-weight:700;">Schedule a Week</h3>`;

  const dateField = document.createElement("div");
  dateField.className = "field";
  dateField.innerHTML = `<label>Any date in the target week</label>`;
  const dateInput = document.createElement("input");
  dateInput.type = "date";
  dateInput.value = state.locationDraft.date;
  dateInput.onclick = () => { if(dateInput.showPicker) dateInput.showPicker(); };
  dateInput.onchange = (e) => { state.locationDraft.date = e.target.value; };
  dateField.appendChild(dateInput);
  addSection.appendChild(dateField);

  const locRow = document.createElement("div");
  locRow.className = "row2";
  const stateField = fieldInput("State", "text", state.locationDraft.state, v => state.locationDraft.state = v, "e.g. Colorado");
  const cityField = fieldInput("City", "text", state.locationDraft.city, v => state.locationDraft.city = v, "e.g. Denver");
  locRow.appendChild(stateField);
  locRow.appendChild(cityField);
  addSection.appendChild(locRow);

  const addErr = document.createElement("div");
  addErr.style.cssText = "color:var(--red);font-size:12.5px;min-height:16px;margin-bottom:4px;";
  addSection.appendChild(addErr);

  const addBtn = document.createElement("button");
  addBtn.className = "launchbtn";
  addBtn.textContent = "Add Location";
  addBtn.onclick = () => {
    const week = isoWeek(state.locationDraft.date);
    const st = stateField.querySelector("input").value.trim();
    const city = cityField.querySelector("input").value.trim();
    if(!st || !city){
      addErr.textContent = "State and city are required";
      return;
    }
    if(schedule.some(l => l.week === week)){
      addErr.textContent = `${week} already has a location scheduled — edit or remove it below instead.`;
      return;
    }
    addErr.textContent = "";
    saveLocationSchedule(studyId, [...schedule, { week, state: st, city }], () => {
      state.locationDraft = { date: new Date().toISOString().slice(0, 10), state: "", city: "" };
    }, addErr);
  };
  addSection.appendChild(addBtn);
  card.appendChild(addSection);

  const listSection = document.createElement("div");
  listSection.innerHTML = `<h3 style="font-size:14px;margin:0 0 12px;font-weight:700;">Scheduled Weeks (${schedule.length})</h3>`;

  if(schedule.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No locations scheduled yet.";
    listSection.appendChild(empty);
  } else {
    const list = document.createElement("div");
    list.className = "studylist";
    schedule.forEach(loc => {
      const row = document.createElement("div");
      row.className = "studyrow";

      if(state.editingLocationId === loc.id){
        row.style.cssText += "flex-direction:column;align-items:stretch;";
        row.innerHTML = `<div class="name">${escapeHtml(loc.week)}</div>`;

        const editRow = document.createElement("div");
        editRow.className = "row2";
        const editState = fieldInput("State", "text", loc.state, () => {}, "");
        const editCity = fieldInput("City", "text", loc.city, () => {}, "");
        editRow.appendChild(editState);
        editRow.appendChild(editCity);
        row.appendChild(editRow);

        const editActions = document.createElement("div");
        editActions.style.cssText = "display:flex;gap:8px;margin-top:8px;";
        const saveBtn = document.createElement("button");
        saveBtn.textContent = "Save";
        saveBtn.onclick = () => {
          const st = editState.querySelector("input").value.trim();
          const city = editCity.querySelector("input").value.trim();
          if(!st || !city) return;
          const next = schedule.map(l => l.id === loc.id ? { ...l, state: st, city } : l);
          saveLocationSchedule(studyId, next, () => { state.editingLocationId = null; });
        };
        const cancelBtn = document.createElement("button");
        cancelBtn.textContent = "Cancel";
        cancelBtn.onclick = () => { state.editingLocationId = null; render(); };
        editActions.appendChild(saveBtn);
        editActions.appendChild(cancelBtn);
        row.appendChild(editActions);
      } else {
        row.innerHTML = `
          <div>
            <div class="name">${escapeHtml(loc.week)}</div>
            <div class="meta">${escapeHtml(loc.city)}, ${escapeHtml(loc.state)}</div>
          </div>
        `;
        const actions = document.createElement("div");
        actions.className = "actions";
        const editBtn = document.createElement("button");
        editBtn.textContent = "Edit";
        editBtn.onclick = () => { state.editingLocationId = loc.id; render(); };
        const delBtn = document.createElement("button");
        delBtn.className = "del";
        delBtn.textContent = "Remove";
        delBtn.onclick = () => {
          if(!confirm(`Remove the ${loc.week} location (${loc.city}, ${loc.state})?`)) return;
          saveLocationSchedule(studyId, schedule.filter(l => l.id !== loc.id));
        };
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        row.appendChild(actions);
      }
      list.appendChild(row);
    });
    listSection.appendChild(list);
  }
  card.appendChild(listSection);

  return card;
}

async function saveLocationSchedule(studyId, locationSchedule, onSuccess, errEl){
  try {
    const res = await fetch("/api/studies", {
      method: "PATCH",
      headers: { "content-type": "application/json", "x-user-token": state.token },
      body: JSON.stringify({ id: studyId, updates: { locationSchedule } })
    });
    const data = await res.json();
    if(!res.ok){
      if(errEl) errEl.textContent = data.error || "Couldn't update locations";
      else alert(data.error || "Couldn't update locations");
      return;
    }
    const idx = state.studies.findIndex(s => s.id === studyId);
    if(idx !== -1) state.studies[idx] = { ...state.studies[idx], locationSchedule: data.study.locationSchedule };
    if(onSuccess) onSuccess();
    render();
  } catch (err) {
    if(errEl) errEl.textContent = "Couldn't reach server";
    else alert("Couldn't reach server");
  }
}

async function loadStudyForEdit(id){
  try {
    const res = await fetch(`/api/studies?id=${encodeURIComponent(id)}`, {
      headers: { "x-user-token": state.token }
    });
    if(!res.ok) throw new Error("Load failed");
    const data = await res.json();
    const s = data.study;
    state.form = {
      editingId: s.id, name: s.name, dateStart: s.dateStart, dateEnd: s.dateEnd,
      passcode: "", teamCount: s.teamCount, protocols: [...s.protocols],
      environments: [...s.environments], objectKitCount: s.objectKitCount,
      signTypes: s.signTypes.map(x => ({...x}))
    };
    state.launchResult = null;
    state.reviewingStudy = false;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  } catch (err) {
    alert("Couldn't load study for editing.");
  }
}

async function deleteStudy(id, name){
  if(!confirm(`Delete "${name}"? This removes the study definition and its field/admin links. Any entries already logged under it are not affected.`)) return;
  try {
    const res = await fetch("/api/studies", {
      method: "DELETE",
      headers: { "content-type": "application/json", "x-user-token": state.token },
      body: JSON.stringify({ id })
    });
    if(!res.ok) {
      const data = await res.json();
      alert(data.error || "Delete failed");
      return;
    }
    if(state.form.editingId === id){
      state.form = blankForm();
      state.reviewingStudy = false;
      state.launchResult = null;
    }
    state.studies = state.studies.filter(s => s.id !== id);
    render();
  } catch (err) {
    alert("Couldn't delete study — try again.");
  }
}

function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

init();
</script>
